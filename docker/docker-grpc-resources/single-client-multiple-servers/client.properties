kafka.sender.defaultKeySerializerClass=org.apache.kafka.common.serialization.BytesSerializer
kafka.sender.defaultValueSerializerClass=org.apache.kafka.common.serialization.BytesSerializer
kafka.bootstrapServers=kafka-target:19092

kafka.topic.prefix=federated
kafka.consumerGroup=ndtp.dbt.gov.uk

redis.host=redis
redis.port=6379
redis.tls.enabled=false
## prefix redis key
redis.prefix = federator-client

# ============================================
# Identity Provider (IDP) Configuration
# ============================================
# ${IDP_*} placeholders are rendered from environment variables by the container entrypoint (envsubst)
# when this file is mounted under /config-templates/. For other setups, replace them with literal values.

# Enable mutual TLS for IDP communication. When false, client-secret authentication is used.
idp.mtls.enabled=true

# OAuth2 client ID (registered with the IDP)
idp.client.id=${IDP_CLIENT_ID}

# OAuth2 client secret (registered with the IDP), required when idp.mtls.enabled=false
idp.client.secret=${IDP_CLIENT_SECRET}

# Token endpoint URL of the IDP (used to fetch OAuth2 tokens)
idp.token.url=${IDP_TOKEN_URL}

# JWKS URL of the IDP (used for verifying JWT signatures)
idp.jwks.url=${IDP_JWKS_URL}

# Backoff time in milliseconds before retrying a failed token request (default: 1000 ms)
idp.token.backoff=1000

# Path to the keystore (PKCS12 or JKS) used for mutual TLS, required when idp.mtls.enabled=true
idp.keystore.path=${IDP_KEYSTORE_PATH}

# Password for the keystore
idp.keystore.password=${IDP_KEYSTORE_PASSWORD}

# Path to the truststore containing the IDP's root CA or certificate chain, required when idp.mtls.enabled=true
idp.truststore.path=${IDP_TRUSTSTORE_PATH}

# Password for the truststore
idp.truststore.password=${IDP_TRUSTSTORE_PASSWORD}
