include:
  - docker-grpc-resources/docker-compose-shared.yml

name: grpc
# Identity Provider settings rendered into the mounted property templates by the
# container entrypoint (envsubst). Set these in the shell or in .env.
x-idp-environment: &idp-environment
  IDP_CLIENT_ID: ${IDP_CLIENT_ID:-}
  IDP_CLIENT_SECRET: ${IDP_CLIENT_SECRET:-}
  IDP_TOKEN_URL: ${IDP_TOKEN_URL:-}
  IDP_JWKS_URL: ${IDP_JWKS_URL:-}
  IDP_KEYSTORE_PATH: ${IDP_KEYSTORE_PATH:-}
  IDP_KEYSTORE_PASSWORD: ${IDP_KEYSTORE_PASSWORD:-}
  IDP_TRUSTSTORE_PATH: ${IDP_TRUSTSTORE_PATH:-}
  IDP_TRUSTSTORE_PASSWORD: ${IDP_TRUSTSTORE_PASSWORD:-}

services:
  federator-server:
    image: uk.gov.dbt.ndtp/${ARTIFACT_ID}-server:${VERSION}
    container_name: federator-server
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *idp-environment
      FEDERATOR_SERVER_PROPERTIES: /config/server.properties
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - core
    depends_on:
      kafka-src:
        condition: service_healthy
    volumes:
      - ./docker-grpc-resources/server.properties:/config-templates/server.properties
      - ./filter:/library
    healthcheck:
      test: "curl -f http://localhost:8080 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure

  federator-client:
    image: uk.gov.dbt.ndtp/${ARTIFACT_ID}-client:${VERSION}
    container_name: federator-client
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *idp-environment
      FEDERATOR_CLIENT_PROPERTIES: /config/client.properties
    networks:
      - core
    volumes:
      - ./docker-grpc-resources/client.properties:/config-templates/client.properties
    healthcheck:
      test: "bash -c \"pgrep -f federator-client || exit 1\""
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      kafka-target:
        condition: service_healthy
      kafka-topics-populator:
        condition: service_completed_successfully
      federator-server:
        condition: service_started
    restart: on-failure

  kafka-message-counter:
    build:
      context: kafka-message-counter
      dockerfile: Dockerfile
    container_name: kafka-message-counter
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      federator-client:
        condition: service_started
      kafka-topics-populator:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER_SERVER: "kafka-target:19092"
      TOPICS_TO_CHECK: "federated-FederatorServer1-knowledge"
      EXPECTED_MESSAGE_COUNTS: "23"
      DELAY_BEFORE_CONSUMING_DATA: "10"
    networks:
      - core
    volumes:
      - ../input:/usr/bin/input
    healthcheck:
      test: "kafka-topics --list --bootstrap-server localhost:9092 || exit 1"
      interval: 1s
      timeout: 60s
      retries: 60