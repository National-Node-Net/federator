include:
  - docker-grpc-resources/docker-compose-shared.yml

name: grpc-no-client
# Identity Provider settings, resolved by the application from ${IDP_*:default}
# placeholders in the mounted properties files. Each variable is only passed to
# the container when it is set in the shell or in .env, so the file defaults apply otherwise.
x-idp-environment: &idp-environment
  IDP_CLIENT_ID:
  IDP_CLIENT_SECRET:
  IDP_TOKEN_URL:
  IDP_JWKS_URL:
  IDP_KEYSTORE_PATH:
  IDP_KEYSTORE_PASSWORD:
  IDP_TRUSTSTORE_PATH:
  IDP_TRUSTSTORE_PASSWORD:

services:
  federator-server:
    image: uk.gov.dbt.ndtp/${ARTIFACT_ID}-server:${VERSION}
    container_name: federator-server
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      <<: *idp-environment
      FEDERATOR_SERVER_PROPERTIES: /config/server.properties
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - core
    depends_on:
      redis:
        condition: service_started
      kafka-topics-populator:
        condition: service_started
    volumes:
      - ./docker-grpc-resources/server.properties:/config-templates/server.properties
      - ./filter:/library
    healthcheck:
      test: "curl -f http://localhost:8080 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: on-failure
