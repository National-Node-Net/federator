name: Development images on merge

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      major:
        description: Major version
        required: false
        default: "1"
        type: string
      minor:
        description: Minor version
        required: false
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      # Fetch the Maven wrapper and POM used to derive the development image tag.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # Install Java for Maven Wrapper commands.
      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      # Generate a unique, timestamped development image tag.
      # Becasue we have multiple images in this repo we only want to do this once otherwise (we would generate different timestamps for each image)
      - id: version
        name: Generate development image version from pom
        run: |
          VERSION="$(./mvnw --batch-mode --no-transfer-progress help:evaluate -Dexpression=project.version -q -DforceStdout)"
          IMAGE_VERSION="${VERSION}-$(date -u +%Y%m%d%H%M%S)" # use a hypen as the versions in this repo are x.x.x-<timestamp>
          echo "POM version: $VERSION"
          echo "Image version: $IMAGE_VERSION"
          echo "value=$IMAGE_VERSION" >> "$GITHUB_OUTPUT"

  ci:
    needs: versioning
    # Run checks before building images that can be deployed.
    uses: ./.github/workflows/ci-pr.yml
    secrets: inherit

  client-push-to-ecr:
    needs: [versioning, ci]
    permissions:
      contents: read
      id-token: write
    # Publish the checked and scanned image to the development ECR account.
    uses: ./.github/workflows/cd-push-to-ecr.yml
    with:
      aws_account_number: ${{ vars.DEV_AWS_ACCOUNT_ID }}
      version: ${{ needs.versioning.outputs.version }}
      repo_name: ndtp/ia-federator-client
      jar_name: federator-client # extra params that differentiate the client image from the normal duplicate workflow pattern
      dockerfile: docker/Dockerfile.client # extra params that differentiate the client image from the normal duplicate workflow pattern

  server-push-to-ecr:
    needs: [versioning, ci]
    permissions:
      contents: read
      id-token: write
    # Publish the checked and scanned image to the development ECR account.
    uses: ./.github/workflows/cd-push-to-ecr.yml
    with:
      aws_account_number: ${{ vars.DEV_AWS_ACCOUNT_ID }}
      version: ${{ needs.versioning.outputs.version }}
      repo_name: ndtp/ia-federator-server
      jar_name: federator-server # extra params that differentiate the server image from the normal duplicate workflow pattern
      dockerfile: docker/Dockerfile.server # extra params that differentiate the server image from the normal duplicate workflow pattern
