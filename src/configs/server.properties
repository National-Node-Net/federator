# Every property value uses a ${ENV_VAR:default} placeholder: if the environment variable (or a system
# property of the same name) is set it is used, otherwise the default after ':' applies.

kafka.bootstrapServers=${KAFKA_BOOTSTRAPSERVERS:localhost:19093}
kafka.defaultKeyDeserializerClass=${KAFKA_DEFAULTKEYDESERIALIZERCLASS:org.apache.kafka.common.serialization.StringDeserializer}
kafka.defaultValueDeserializerClass=${KAFKA_DEFAULTVALUEDESERIALIZERCLASS:uk.gov.dbt.ndtp.federator.access.AccessMessageDeserializer}
kafka.consumerGroup=${KAFKA_CONSUMERGROUP:server.consumer}
kafka.pollDuration=${KAFKA_POLLDURATION:PT10S}
kafka.pollRecords=${KAFKA_POLLRECORDS:100}
## Decides which kafka headers are shared. This is a '^' separated list
shared.headers=${SHARED_HEADERS:Security-Label^Content-Type}
## share all data default is false
filter.shareAll=${FILTER_SHAREALL:false}
server.port=${SERVER_PORT:8080}
# Default server.mtlsEnabled for the GRPc server is false
server.mtlsEnabled=${SERVER_MTLSENABLED:true}
## If server.mtlsEnabled is set then you need set the file path to the cert chain file
server.p12FilePath=${SERVER_P12FILEPATH:}
server.p12Password=${SERVER_P12PASSWORD:}
server.truststoreFilePath=${SERVER_TRUSTSTOREFILEPATH:}
server.truststorePassword=${SERVER_TRUSTSTOREPASSWORD:}
## Default server.keepAliveTime for the GRPC server is 5 secs
server.keepAliveTime=${SERVER_KEEPALIVETIME:10}
## Default server.keepAliveTimeout for the GRPC server is 1 sec
#server.keepAliveTimeou
# ============================================
# Identity Provider (IDP) Configuration
# ============================================
# Every value below can be overridden by the environment variable named in its placeholder.
# The IDP URLs, client ID and credentials have empty defaults and must be provided.

# Enable mutual TLS for IDP communication. When false, client-secret authentication is used.
idp.mtls.enabled=${IDP_MTLS_ENABLED:true}

# OAuth2 client ID (registered with the IDP)
idp.client.id=${IDP_CLIENT_ID:}

# OAuth2 client secret (registered with the IDP), required when idp.mtls.enabled=false
idp.client.secret=${IDP_CLIENT_SECRET:}

# Token endpoint URL of the IDP (used to fetch OAuth2 tokens)
idp.token.url=${IDP_TOKEN_URL:}

# JWKS URL of the IDP (used for verifying JWT signatures)
idp.jwks.url=${IDP_JWKS_URL:}

# Backoff time in milliseconds before retrying a failed token request (default: 1000 ms)
idp.token.backoff=${IDP_TOKEN_BACKOFF:1000}

# Path to the keystore (PKCS12 or JKS) used for mutual TLS, required when idp.mtls.enabled=true
idp.keystore.path=${IDP_KEYSTORE_PATH:}

# Password for the keystore
idp.keystore.password=${IDP_KEYSTORE_PASSWORD:}

# Path to the truststore containing the IDP's root CA or certificate chain, required when idp.mtls.enabled=true
idp.truststore.path=${IDP_TRUSTSTORE_PATH:}

# Password for the truststore
idp.truststore.password=${IDP_TRUSTSTORE_PASSWORD:}
# ============================================
# Federator Configuration
# ============================================

# Producer ID for federator
federator.producer.id=${FEDERATOR_PRODUCER_ID:}

# ============================================
# Management Node Configuration
# ============================================

# Base URL for the management node
management.node.base.url=${MANAGEMENT_NODE_BASE_URL:https://localhost:8090}

# Request timeout in seconds for management node connections
management.node.request.timeout=${MANAGEMENT_NODE_REQUEST_TIMEOUT:5}

# ============================================
# Resilience4j (Retry & Circuit Breaker) Configuration
# These settings control how the federator retries and circuit-breaks calls
# to the management node when fetching configurations. Defaults are shown below.
#

# Max number of attempts for a failing call before giving up (default: 10)
management.node.resilience.retry.maxAttempts=${MANAGEMENT_NODE_RESILIENCE_RETRY_MAXATTEMPTS:10}

# Initial delay before the first retry (ISO-8601 duration)
management.node.resilience.retry.initialWait=${MANAGEMENT_NODE_RESILIENCE_RETRY_INITIALWAIT:PT0.2S}

# Maximum delay cap between retries with exponential backoff (default: PT0.2S)
management.node.resilience.retry.maxBackoff=${MANAGEMENT_NODE_RESILIENCE_RETRY_MAXBACKOFF:PT15M}

# Comma-separated Throwable classes eligible for retries  (default: java.io.IOException,java.net.SocketTimeoutException)
management.node.resilience.retry.retryOn=${MANAGEMENT_NODE_RESILIENCE_RETRY_RETRYON:java.io.IOException,java.net.SocketTimeoutException}

# Failure percentage to open the breaker
 management.node.resilience.circuitBreaker.failureRateThreshold=${MANAGEMENT_NODE_RESILIENCE_CIRCUITBREAKER_FAILURERATETHRESHOLD:50}

# Number of calls evaluated to calculate failure rate
management.node.resilience.circuitBreaker.slidingWindowSize=${MANAGEMENT_NODE_RESILIENCE_CIRCUITBREAKER_SLIDINGWINDOWSIZE:10}

# Minimum calls before breaker evaluates failure rate
management.node.resilience.circuitBreaker.minimumNumberOfCalls=${MANAGEMENT_NODE_RESILIENCE_CIRCUITBREAKER_MINIMUMNUMBEROFCALLS:20}

# Concurrent test calls allowed when half-open (default: 1)
management.node.resilience.circuitBreaker.permittedNumberOfCallsInHalfOpenState=${MANAGEMENT_NODE_RESILIENCE_CIRCUITBREAKER_PERMITTEDNUMBEROFCALLSINHALFOPENSTATE:1}

# Time the breaker stays open before half-open
management.node.resilience.circuitBreaker.waitDurationInOpenState=${MANAGEMENT_NODE_RESILIENCE_CIRCUITBREAKER_WAITDURATIONINOPENSTATE:PT60S}

# ============================================
# Cache Configuration
# ============================================

# Cache time-to-live in seconds
management.node.cache.ttl.seconds=${MANAGEMENT_NODE_CACHE_TTL_SECONDS:60}



# ============================================
# Management Node API Endpoints
# ============================================

# Producer configuration endpoint
management.node.api.endpoints.producer=${MANAGEMENT_NODE_API_ENDPOINTS_PRODUCER:}

# ============================================
# OPA Configuration
# ============================================

policy.enforcement.enabled=${POLICY_ENFORCEMENT_ENABLED:true}
opa.url=${OPA_URL:http://localhost:8181}
opa.decision-path=${OPA_DECISIONPATH:/v1/data/producer/decision}

opa.connect-timeout=${OPA_CONNECTTIMEOUT:5}
opa.read-timeout=${OPA_READTIMEOUT:5}

# ============================================
# Redis configuration
# ============================================
redis.host=${REDIS_HOST:localhost}
## Default redis.port is 6379
redis.port=${REDIS_PORT:6380}
## Default redis.tls.enabled empty value "" = false, missing property entry = true
redis.tls.enabled=${REDIS_TLS_ENABLED:false}
## prefix redis key
redis.prefix = ${REDIS_PREFIX:federator-server}
# If redis authentication is enabled then set the username and password here. If only a password is required then keep the username as an empty string.
redis.username=${REDIS_USERNAME:}
redis.password=${REDIS_PASSWORD:}
# For access token cached in Redis set this property to an AES key (Base64 encoded) for encryption/decryption purposes.
redis.aes.key=${REDIS_AES_KEY:}

file.stream.chunk.size=${FILE_STREAM_CHUNK_SIZE:}

# AWS S3 client configuration (also used by server components)
# These properties are used by S3ClientFactory to create the client. For Static IAM User
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.access.key.id=${AWS_S3_ACCESS_KEY_ID:}
aws.s3.secret.access.key=${AWS_S3_SECRET_ACCESS_KEY:}
# Optional S3-compatible endpoint (e.g., MinIO): http://localhost:9000
aws.s3.endpoint.url=${AWS_S3_ENDPOINT_URL:}
# SSO profile name (local-dev)
aws.s3.profile=${AWS_S3_PROFILE:}
# IAM Role on EC2/ECS/Lambda # No profile and no static keys Optionally set region; otherwise its auto-resolved

# Azure Blob Storage Configuration
# Option 1: Connection string (recommended for local/dev or Azurite)
azure.storage.connection.string=${AZURE_STORAGE_CONNECTION_STRING:}
# Option 2: Endpoint URL used with managed identity / service principal via DefaultAzureCredential
# Set this when running in production without a connection string. Example:
#   https://<account-name>.blob.core.windows.net
# If both connection string and endpoint are set, the connection string takes precedence.
azure.storage.endpoint=${AZURE_STORAGE_ENDPOINT:}

# Google Cloud Storage (GCP) Configuration
# GCP project ID (optional; if not set, will use default from credentials or environment)
gcp.storage.project.id=${GCP_STORAGE_PROJECT_ID:}
# Authentication uses Application Default Credentials (ADC)
# ADC will check: GOOGLE_APPLICATION_CREDENTIALS env var, gcloud CLI, or GCE/GKE metadata
# Optional GCS-compatible endpoint (e.g., for fake-gcs-server during local testing)
# Example: http://localhost:4443
gcp.storage.endpoint.url=${GCP_STORAGE_ENDPOINT_URL:}
