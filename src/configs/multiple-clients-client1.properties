# Every property value uses a ${ENV_VAR:default} placeholder: if the environment variable (or a system
# property of the same name) is set it is used, otherwise the default after ':' applies.

kafka.sender.defaultKeySerializerClass=${KAFKA_SENDER_DEFAULTKEYSERIALIZERCLASS:org.apache.kafka.common.serialization.BytesSerializer}
kafka.sender.defaultValueSerializerClass=${KAFKA_SENDER_DEFAULTVALUESERIALIZERCLASS:org.apache.kafka.common.serialization.BytesSerializer}
kafka.bootstrapServers=${KAFKA_BOOTSTRAPSERVERS:kafka-target:19092}

###
### The following are the controls used when read from topics used by the client and the server
###
## Default retries.max_attempts is 200
#retries.max_attempts=
## Default retries.initial_backoff is 500 (ms)
#retries.initial_backoff=
## Default retries.max_backoff is 60000 (ms)
#retries.max_backoff=
## Default retries.forever is true (retry forever)
## Back off time doubles every iteration up to the max_backoff time. After max attempts it exits
## if the reties.forever is set to false.
#retries.forever=

## kafka.topic.prefix default is empty string
kafka.topic.prefix=${KAFKA_TOPIC_PREFIX:federated-}
kafka.consumerGroup=${KAFKA_CONSUMERGROUP:ndtp.dbt.gov.uk.1}
## Default redis.host is localhost
redis.host=${REDIS_HOST:redis}
## Default redis.port is 6379
redis.port=${REDIS_PORT:6379}
## Default redis.tls.enabled empty value "" = false, missing property entry = true
redis.tls.enabled=${REDIS_TLS_ENABLED:false}
## prefix redis key
redis.prefix = ${REDIS_PREFIX:federator-client}
# If redis authentication is enabled then set the username and password here. If only a password is required then keep the username as an empty string.
redis.username=${REDIS_USERNAME:}
redis.password=${REDIS_PASSWORD:}
# For access token cached in Redis set this property to an AES key (Base64 encoded) for encryption/decryption purposes.
redis.aes.key=${REDIS_AES_KEY:}

# ============================================
# Azure Blob Storage (Consumer Destination)
# ============================================
# When using AZURE as the storage provider, configure the target container (shared key for client and server)
files.azure.container=${FILES_AZURE_CONTAINER:}

# Azure Storage connection string used to authenticate the Azure Blob client.
# Required when client.files.storage.provider=AZURE.
# Example (real Azure):
# azure.storage.connection.string=DefaultEndpointsProtocol=https;AccountName=<account>;AccountKey=<key>;EndpointSuffix=core.windows.net
# Example (Azurite dev):
# azure.storage.connection.string=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=<key>;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
azure.storage.connection.string=${AZURE_STORAGE_CONNECTION_STRING:}

# ============================================
# Identity Provider (IDP) Configuration
# ============================================
# Every value below can be overridden by the environment variable named in its placeholder.
# The IDP URLs, client ID and credentials have empty defaults and must be provided.

# Enable mutual TLS for IDP communication. When false, client-secret authentication is used.
idp.mtls.enabled=${IDP_MTLS_ENABLED:true}

# OAuth2 client ID (registered with the IDP)
idp.client.id=${IDP_CLIENT_ID:}

# OAuth2 client secret (registered with the IDP), required when idp.mtls.enabled=false
idp.client.secret=${IDP_CLIENT_SECRET:}

# Token endpoint URL of the IDP (used to fetch OAuth2 tokens)
idp.token.url=${IDP_TOKEN_URL:}

# JWKS URL of the IDP (used for verifying JWT signatures)
idp.jwks.url=${IDP_JWKS_URL:}

# Backoff time in milliseconds before retrying a failed token request (default: 1000 ms)
idp.token.backoff=${IDP_TOKEN_BACKOFF:1000}

# Path to the keystore (PKCS12 or JKS) used for mutual TLS, required when idp.mtls.enabled=true
idp.keystore.path=${IDP_KEYSTORE_PATH:}

# Password for the keystore
idp.keystore.password=${IDP_KEYSTORE_PASSWORD:}

# Path to the truststore containing the IDP's root CA or certificate chain, required when idp.mtls.enabled=true
idp.truststore.path=${IDP_TRUSTSTORE_PATH:}

# Password for the truststore
idp.truststore.password=${IDP_TRUSTSTORE_PASSWORD:}
