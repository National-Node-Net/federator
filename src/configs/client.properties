# Every property value uses a ${ENV_VAR:default} placeholder: if the environment variable (or a system
# property of the same name) is set it is used, otherwise the default after ':' applies.

kafka.sender.defaultKeySerializerClass=${KAFKA_SENDER_DEFAULTKEYSERIALIZERCLASS:org.apache.kafka.common.serialization.BytesSerializer}
kafka.sender.defaultValueSerializerClass=${KAFKA_SENDER_DEFAULTVALUESERIALIZERCLASS:org.apache.kafka.common.serialization.BytesSerializer}
kafka.bootstrapServers=${KAFKA_BOOTSTRAPSERVERS:localhost:29093}

###
### The following are the controls used when read from topics used by the client and the server
###
## Default retries.max_attempts is 200
#retries.max_attempts=
## Default retries.initial_backoff is 500 (ms)
#retries.initial_backoff=
## Default retries.max_backoff is 60000 (ms)
#retries.max_backoff=
## Default retries.forever is true (retry forever)
## Back off time doubles every iteration up to the max_backoff time. After max attempts it exits
## if the reties.forever is set to false.
#retries.forever=

## kafka.topic.prefix default is empty string
kafka.topic.prefix=${KAFKA_TOPIC_PREFIX:federated}
kafka.consumerGroup=${KAFKA_CONSUMERGROUP:ndtp.dbt.gov.uk}

## Default redis.host is localhost
redis.host=${REDIS_HOST:localhost}
## Default redis.port is 6379
redis.port=${REDIS_PORT:6380}
## Default redis.tls.enabled empty value "" = false, missing property entry = true
redis.tls.enabled=${REDIS_TLS_ENABLED:false}
## prefix redis key
redis.prefix = ${REDIS_PREFIX:federator-client}


# If redis authentication is enabled then set the username and password here. If only a password is required then keep the username as an empty string.
redis.username=${REDIS_USERNAME:}
redis.password=${REDIS_PASSWORD:}

# For access token cached in Redis set this property to an AES key (Base64 encoded) for encryption/decryption purposes.
redis.aes.key=${REDIS_AES_KEY:}

## If client.tlsEnabled is set to true then you need to set the file path for CA cert and P12 file
client.p12Password=${CLIENT_P12PASSWORD:changeit}
client.p12FilePath=${CLIENT_P12FILEPATH:client.p12}
client.truststoreFilePath=${CLIENT_TRUSTSTOREFILEPATH:truststore.jks}
client.truststorePassword=${CLIENT_TRUSTSTOREPASSWORD:changeit}
# mTLS to producers (referenced above). false: no revocation checks of producer certificates, a WARN at startup.
# TLS itself is chosen per producer by the Management Node configuration (tls=true/false).
client.tlsEnabled=${CLIENT_TLSENABLED:true}
# TLS session lifetime; an older session cannot be resumed and needs a full handshake (default 300)
client.tlsSessionTimeout.seconds=${CLIENT_TLSSESSIONTIMEOUT_SECONDS:300}

# ============================================
# Identity Provider (IDP) Configuration
# ============================================
# Every value below can be overridden by the environment variable named in its placeholder.
# The IDP URLs, client ID and credentials have empty defaults and must be provided.

# Enable mutual TLS for IDP communication. When false, client-secret authentication is used.
idp.mtls.enabled=${IDP_MTLS_ENABLED:true}

# OAuth2 client ID (registered with the IDP)
idp.client.id=${IDP_CLIENT_ID:}

# OAuth2 client secret (registered with the IDP), required when idp.mtls.enabled=false
idp.client.secret=${IDP_CLIENT_SECRET:}

# Token endpoint URL of the IDP (used to fetch OAuth2 tokens)
idp.token.url=${IDP_TOKEN_URL:}

# JWKS URL of the IDP (used for verifying JWT signatures)
idp.jwks.url=${IDP_JWKS_URL:}

# Backoff time in milliseconds before retrying a failed token request (default: 1000 ms)
idp.token.backoff=${IDP_TOKEN_BACKOFF:1000}

# Path to the keystore (PKCS12 or JKS) used for mutual TLS, required when idp.mtls.enabled=true
idp.keystore.path=${IDP_KEYSTORE_PATH:}

# Password for the keystore
idp.keystore.password=${IDP_KEYSTORE_PASSWORD:}

# Path to the truststore containing the IDP's root CA or certificate chain, required when idp.mtls.enabled=true
idp.truststore.path=${IDP_TRUSTSTORE_PATH:}

# Password for the truststore
idp.truststore.password=${IDP_TRUSTSTORE_PASSWORD:}


# ============================================
# JobRunr Configuration
# ============================================
org.jobrunr.jobs.default-allow-concurrent-execution=${ORG_JOBRUNR_JOBS_DEFAULTALLOWCONCURRENTEXECUTION:false}
jobs.dashboard.port=${JOBS_DASHBOARD_PORT:8085}
jobs.dashboard.enabled=${JOBS_DASHBOARD_ENABLED:true}

# Consumer ID for federator (Optional Field)
federator.consumer.id=${FEDERATOR_CONSUMER_ID:}

# ============================================
# Management Node Configuration
# ============================================

# Base URL for the management node
management.node.base.url=${MANAGEMENT_NODE_BASE_URL:https://localhost:8090}

# Request timeout in seconds for management node connections
management.node.request.timeout=${MANAGEMENT_NODE_REQUEST_TIMEOUT:5}

# ============================================
# Resilience4j (Retry & Circuit Breaker) Configuration
# These settings control how the federator retries and circuit-breaks calls
# to the management node when fetching configurations. Defaults are shown below.
#
# ============================================
# Resilience4j (Retry & Circuit Breaker) Configuration
# These settings control how the federator retries and circuit-breaks calls
# to the management node when fetching configurations. Defaults are shown below.
#

# Max number of attempts for a failing call before giving up (default: 10)
management.node.resilience.retry.maxAttempts=${MANAGEMENT_NODE_RESILIENCE_RETRY_MAXATTEMPTS:10}

# Initial delay before the first retry (ISO-8601 duration)
management.node.resilience.retry.initialWait=${MANAGEMENT_NODE_RESILIENCE_RETRY_INITIALWAIT:PT5.0S}

# Maximum delay cap between retries with exponential backoff (default: PT0.2S)
management.node.resilience.retry.maxBackoff=${MANAGEMENT_NODE_RESILIENCE_RETRY_MAXBACKOFF:PT15M}

# Comma-separated Throwable classes eligible for retries  (default: java.io.IOException,java.net.SocketTimeoutException)
management.node.resilience.retry.retryOn=${MANAGEMENT_NODE_RESILIENCE_RETRY_RETRYON:java.io.IOException,java.net.SocketTimeoutException}

# Failure percentage to open the breaker
management.node.resilience.circuitBreaker.failureRateThreshold=${MANAGEMENT_NODE_RESILIENCE_CIRCUITBREAKER_FAILURERATETHRESHOLD:50}

# Number of calls evaluated to calculate failure rate
management.node.resilience.circuitBreaker.slidingWindowSize=${MANAGEMENT_NODE_RESILIENCE_CIRCUITBREAKER_SLIDINGWINDOWSIZE:10}

# Minimum calls before breaker evaluates failure rate
management.node.resilience.circuitBreaker.minimumNumberOfCalls=${MANAGEMENT_NODE_RESILIENCE_CIRCUITBREAKER_MINIMUMNUMBEROFCALLS:20}

# Concurrent test calls allowed when half-open (default: 1)
management.node.resilience.circuitBreaker.permittedNumberOfCallsInHalfOpenState=${MANAGEMENT_NODE_RESILIENCE_CIRCUITBREAKER_PERMITTEDNUMBEROFCALLSINHALFOPENSTATE:1}

# Time the breaker stays open before half-open
management.node.resilience.circuitBreaker.waitDurationInOpenState=${MANAGEMENT_NODE_RESILIENCE_CIRCUITBREAKER_WAITDURATIONINOPENSTATE:PT60S}


# ============================================
# Cache Configuration
# ============================================

# Cache time-to-live in seconds
management.node.cache.ttl.seconds=${MANAGEMENT_NODE_CACHE_TTL_SECONDS:60}

# ============================================
# Revocation (OCSP) Configuration
# Producer server certificates are checked against the Management Node OCSP API in the TLS handshake,
# for every call and again whenever a cached status of a producer with open calls expires.
# Applies to producers with tls=true when client.tlsEnabled=true. See docs/certificate-revocation.md.
# ============================================

# Master switch (default: true). false: no checks, a WARN is logged at startup
revocation.enforcement.enabled=${REVOCATION_ENFORCEMENT_ENABLED:true}

# No valid status (responder unreachable, circuit open, invalid response) rejects the producer (default: true)
revocation.enforcement.failClosed=${REVOCATION_ENFORCEMENT_FAILCLOSED:true}

# OCSP endpoint, appended to management.node.base.url (default: /api/v1/certificate/ocsp).
# The endpoint needs mTLS (idp.keystore.*) and a token with the management-node client role check_certificate_status.
revocation.ocsp.path=${REVOCATION_OCSP_PATH:/api/v1/certificate/ocsp}

# Timeout of one OCSP attempt in seconds; a check never takes longer than requestTimeout x retry.maxAttempts (default: 2)
revocation.ocsp.requestTimeout=${REVOCATION_OCSP_REQUESTTIMEOUT:2}

# Send a nonce and require the response to echo it (default: true)
revocation.ocsp.requireNonce=${REVOCATION_OCSP_REQUIRENONCE:true}

# Require id-kp-OCSPSigning on the OCSP signer certificate (default: true).
# Transitional: false accepts a signer without it when its CN is revocation.ocsp.signerCommonName, only with an
# https OCSP URL, as long as the Management Node issues its signer through the default PKI role.
# Set back to true once the dedicated role is used.
revocation.ocsp.requireSignerEku=${REVOCATION_OCSP_REQUIRESIGNEREKU:true}
revocation.ocsp.signerCommonName=${REVOCATION_OCSP_SIGNERCOMMONNAME:ocsp-signer.management-node}

# ============================================
# Revocation cache
# ============================================

# memory (default, per instance) or redis (shared by all instances, uses the redis.* settings,
# keys ${redis.prefix}:cert-status:<issuerKeyHash>:<serial>, plain JSON)
revocation.cache.type=${REVOCATION_CACHE_TYPE:memory}

# How long a status is reused, in seconds; also the longest time the consumer keeps receiving from a revoked
# producer. The earlier of this and the response's nextUpdate applies. Default 300, maximum 600 (startup fails above).
revocation.cache.ttl.seconds=${REVOCATION_CACHE_TTL_SECONDS:300}

# Size bound of the in-memory cache (default: 10000)
revocation.cache.maxEntries=${REVOCATION_CACHE_MAXENTRIES:10000}

# ============================================
# Revocation resilience (separate from management.node.resilience.*)
# ============================================

# Attempts in total, including the first (default: 2)
revocation.ocsp.resilience.retry.maxAttempts=${REVOCATION_OCSP_RESILIENCE_RETRY_MAXATTEMPTS:2}

# Wait before the first retry, doubled before each further retry (default: PT0.1S)
revocation.ocsp.resilience.retry.initialWait=${REVOCATION_OCSP_RESILIENCE_RETRY_INITIALWAIT:PT0.1S}

# Cap on the wait between retries (default: PT0.5S)
revocation.ocsp.resilience.retry.maxBackoff=${REVOCATION_OCSP_RESILIENCE_RETRY_MAXBACKOFF:PT0.5S}

# Failure percentage that opens the breaker (default: 50)
revocation.ocsp.resilience.circuitBreaker.failureRateThreshold=${REVOCATION_OCSP_RESILIENCE_CIRCUITBREAKER_FAILURERATETHRESHOLD:50}

# Number of calls evaluated to calculate the failure rate (default: 10)
revocation.ocsp.resilience.circuitBreaker.slidingWindowSize=${REVOCATION_OCSP_RESILIENCE_CIRCUITBREAKER_SLIDINGWINDOWSIZE:10}

# Time the breaker stays open before half-open (default: PT30S)
revocation.ocsp.resilience.circuitBreaker.waitDurationInOpenState=${REVOCATION_OCSP_RESILIENCE_CIRCUITBREAKER_WAITDURATIONINOPENSTATE:PT30S}

# ============================================
# Metrics
# ============================================

# Prometheus endpoint GET /metrics (default: true; port 9465, so it does not clash with a producer on 9464)
metrics.enabled=${METRICS_ENABLED:true}
metrics.port=${METRICS_PORT:9465}

# ============================================
# File Storage Configuration
# ============================================
# Storage provider for received files: LOCAL, S3, or AZURE
# Default is LOCAL
client.files.storage.provider=${CLIENT_FILES_STORAGE_PROVIDER:LOCAL}

# When using LOCAL, this is the directory where the client stores received files and temporary parts during assembly.
# Absolute or relative path is accepted. If not set, defaults to `${java.io.tmpdir}/federator-files`.
client.files.temp.dir=${CLIENT_FILES_TEMP_DIR:}

# When using S3, configure the target bucket (shared key for client and server)
files.s3.bucket=${FILES_S3_BUCKET:}
# AWS S3 client configuration (also used by server components)
# These properties are used by S3ClientFactory to create the client. For Static IAM User
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.access.key.id=${AWS_S3_ACCESS_KEY_ID:}
aws.s3.secret.access.key=${AWS_S3_SECRET_ACCESS_KEY:}
# Optional S3-compatible endpoint (e.g., MinIO): http://localhost:9000
aws.s3.endpoint.url=${AWS_S3_ENDPOINT_URL:}
# SSO profile name (local-dev)
aws.s3.profile=${AWS_S3_PROFILE:}
# IAM Role on EC2/ECS/Lambda # No profile and no static keys Optionally set region; otherwise its auto-resolved

## ============================================
## Azure Blob Storage (Consumer Destination)
## ============================================
# When using AZURE as the storage provider, configure the target container (shared key for client and server)
files.azure.container=${FILES_AZURE_CONTAINER:}

# Azure Storage connection options for the Azure Blob client.
# Option 1: Connection string (recommended for local/dev or Azurite)
# Example (real Azure):
# azure.storage.connection.string=DefaultEndpointsProtocol=https;AccountName=<account>;AccountKey=<key>;EndpointSuffix=core.windows.net
# Example (Azurite dev):
# azure.storage.connection.string=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=<key>;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;
azure.storage.connection.string=${AZURE_STORAGE_CONNECTION_STRING:}

# Option 2: Endpoint URL used with DefaultAzureCredential (Managed Identity/Service Principal)
# Set this when running in production without a connection string. Example:
#   https://<account-name>.blob.core.windows.net
# If both connection string and endpoint are set, the connection string takes precedence.
azure.storage.endpoint=${AZURE_STORAGE_ENDPOINT:}

## ============================================
## Google Cloud Storage (GCP) (Consumer Destination)
## ============================================
# When using GCP as the storage provider, configure the target bucket (shared key for client and server)
files.gcp.bucket=${FILES_GCP_BUCKET:}

# GCP Storage client configuration (also used by server components)
# These properties are used by GcsClientFactory to create the client.

# GCP project ID (optional; resolved from credentials or environment if not set)
gcp.storage.project.id=${GCP_STORAGE_PROJECT_ID:}

# Path to service account JSON key file (optional; uses Application Default Credentials if not set)
# When not set, the system uses ADC (GOOGLE_APPLICATION_CREDENTIALS env var, gcloud CLI, or GCE/GKE metadata)
gcp.storage.credentials.file=${GCP_STORAGE_CREDENTIALS_FILE:}

# Optional GCS-compatible endpoint for local testing (e.g., fake-gcs-server): http://localhost:4443
# For real Google Cloud Storage, leave this blank.
gcp.storage.endpoint.url=${GCP_STORAGE_ENDPOINT_URL:}